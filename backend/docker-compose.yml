services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-payroll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance_payroll
    ports:
      - "5432:5432"
    volumes:
      - attendance_payroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_payroll"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendance_payroll_pgdata:
